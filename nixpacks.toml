[providers]
    php = "php"

[phases.setup]
    nixPkgs = ["...", "nodejs"]

[phases.install]
    cmds = [
        "composer install --no-dev --optimize-autoloader",
        "npm install",
    ]

[phases.build]
    cmds = [
        "npm run build",
        "php artisan route:cache",
        "php artisan view:cache",
    ]

[start]
    cmd = "php artisan migrate:fresh --seed --force && php artisan config:cache && php artisan serve --host 0.0.0.0 --port $PORT"
